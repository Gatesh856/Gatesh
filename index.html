HTML

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gatesh</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f5f9;color:#172033}
header{background:#102b46;color:white;padding:25px 20px;border-radius:0 0 25px 25px}
header h1{margin:0;font-size:28px}
header p{color:#b9d1e5}
main{padding:18px}
.card{background:white;padding:18px;border-radius:16px;margin-bottom:15px;box-shadow:0 3px 12px #0000000c}
.balance{background:#087c68;color:white}
.balance h2{font-size:30px;margin:10px 0}
label{display:block;margin:12px 0 6px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;font-size:16px}
button{background:#087c68;color:white;border:0;padding:13px;border-radius:9px;width:100%;font-size:16px;margin-top:12px}
.item{border-bottom:1px solid #eee;padding:12px 0}
.small{color:#64748b;font-size:13px}
</style>
</head>
<body>
<header>
<h1>Gatesh</h1>
<p>Your phone instalment manager</p>
</header>
<main>
<div class="card balance">
<div>Total outstanding balance</div>
<h2 id="balance">KSh 0</h2>
<div id="count">0 active plans</div>
</div>

<div class="card">
<h3>Add a phone instalment</h3>
<label>Phone name</label>
<input id="phone" placeholder="e.g. Tecno Spark">
<label>Total phone price (KSh)</label>
<input id="price" type="number" placeholder="15000">
<label>Deposit paid (KSh)</label>
<input id="deposit" type="number" placeholder="3000">
<label>Monthly payment (KSh)</label>
<input id="monthly" type="number" placeholder="2000">
<label>Number of months</label>
<input id="months" type="number" placeholder="6">
<button onclick="addPlan()">Save instalment</button>
</div>

<div class="card">
<h3>My instalments</h3>
<div id="plans">No instalments added yet.</div>
</div>
</main>
<script>
let plans=JSON.parse(localStorage.getItem("gateshPlans")||"[]");

function money(n){
return "KSh "+Number(n).toLocaleString("en-KE");
}
function save(){
localStorage.setItem("gateshPlans",JSON.stringify(plans));
render();
}
function addPlan(){
let phone=document.getElementById("phone").value.trim();
let price=Number(document.getElementById("price").value);
let deposit=Number(document.getElementById("deposit").value);
let monthly=Number(document.getElementById("monthly").value);
let months=Number(document.getElementById("months").value);

if(!phone||price<=0||deposit<0||monthly<=0||months<=0||deposit>price){
alert("Please enter valid instalment details.");
return;
}
plans.push({phone,price,deposit,monthly,months,paid:deposit});
save();
document.getElementById("phone").value="";
document.getElementById("price").value="";
document.getElementById("deposit").value="";
document.getElementById("monthly").value="";
document.getElementById("months").value="";
}
function payment(i){
let amount=Number(prompt("Enter payment amount in KSh:"));
if(!Number.isFinite(amount)||amount<=0)return;
let p=plans[i];
p.paid=Math.min(p.price,p.paid+amount);
save();
}
function render(){
let balance=0;
plans.forEach(p=>balance+=Math.max(0,p.price-p.paid));
document.getElementById("balance").textContent=money(balance);
document.getElementById("count").textContent=plans.filter(p=>p.paid<p.price).length+" active plans";
let html="";
plans.forEach((p,i)=>{
let remaining=Math.max(0,p.price-p.paid);
let progress=Math.min(100,p.paid/p.price*100);
html+=`<div class="item">
<strong>${p.phone}</strong>
<p class="small">Price: ${money(p.price)}</p>
<p>Paid: ${money(p.paid)}</p>
<p>Remaining: <strong>${money(remaining)}</strong></p>
<div style="background:#e5e7eb;height:8px;border-radius:9px">
<div style="background:#087c68;width:${progress}%;height:8px;border-radius:9px"></div>
</div>
<p class="small">${progress.toFixed(0)}% paid</p>
<button onclick="payment(${i})">Record payment</button>
</div>`;
});
document.getElementById("plans").innerHTML=html||"No instalments added yet.";
}
render();
</script>
</body>
</html>
